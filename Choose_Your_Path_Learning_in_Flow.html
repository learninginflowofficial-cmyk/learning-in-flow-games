<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Your Path — Learning in Flow®</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#edf6f4;color:#173a46;margin:0}main{max-width:820px;margin:auto;padding:18px}header{background:linear-gradient(120deg,#164760,#22877c);color:white;padding:25px;border-radius:20px}h1{margin:0}.card{background:white;padding:22px;border-radius:18px;margin-top:16px;box-shadow:0 5px 18px #163d4b13}button{border:0;border-radius:12px;padding:14px 18px;background:#176d76;color:white;font:inherit;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:hover{filter:brightness(1.12)}button:focus-visible{outline:3px solid orange}.option{display:block;text-align:left;width:100%;background:#eaf2ff;color:#173e5d;border:2px solid #d0e1f2}.option:hover{border-color:#176d76}.muted{color:#576e76}.badge{background:#d9eee9;border-radius:30px;padding:7px 12px;display:inline-block;font-weight:700}.feedback{background:#eefaf5;border-left:5px solid #229b81;padding:17px;border-radius:9px;line-height:1.6}.progress{height:9px;background:#d9e9e7;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#299d86}textarea{width:100%;min-height:100px;border:2px solid #cddfdd;border-radius:10px;padding:12px;font:inherit}.secondary{background:#e3efee;color:#175560}footer{text-align:center;padding:24px;color:#647b7f}@media print{button,header{display:none}body{background:white}}</style><main><header><p>🌿 Learning in Flow®</p><h1>🧭 Choose Your Path</h1><p>Pause • Consider • Choose • Reflect</p></header><div id="game"></div><footer>Learning in Flow® | Practice decisions without pressure | Works offline</footer></main><script>
const sets=[{name:'🤝 Friends & Peer Pressure',scenes:[['The Group Chat','Friends are making fun of another student in a group chat. Someone asks you to join in.',['Make a mean joke too.','Say you are not comfortable and change the subject.','Leave the chat and check on the student.'],['Joining in may help you fit in briefly, but it can hurt someone.','You set a boundary and offer a different direction.','You avoid harm and show care. If bullying continues, tell a trusted adult.'],[0,2,2]],['The Answer Key','A friend offers you a picture of tomorrow’s quiz answers. You feel unprepared.',['Use the picture.','Say no and ask for help studying.','Ignore the picture and make a quick review plan.'],['You might get a grade, but you miss learning and risk consequences.','You protect your integrity and seek support.','You avoid cheating and take responsibility for preparation.'],[0,2,2]],['Left Out','A classmate is sitting alone while your group is making plans.',['Ignore them.','Invite them to join if they want.','Ask the group if there is room for one more.'],['The classmate may feel unseen.','You offer inclusion while respecting their choice.','You take initiative to make space.'],[0,2,2]]]},{name:'🌦️ Conflict & Emotions',scenes:[['A Hurtful Comment','Someone laughs when you answer a question incorrectly. You feel angry.',['Insult them back.','Take a breath and calmly say that was hurtful.','Take space and speak to them or an adult later.'],['Reacting immediately may escalate the conflict.','You regulate first and communicate a boundary.','Taking time can help you respond thoughtfully.'],[0,2,2]],['The Text','Your friend replies “Whatever.” You assume they are mad.',['Send an angry response.','Ask if everything is okay.','Post about them online.'],['You may be reacting to a misunderstanding.','You check your assumption before responding.','Making it public may create more conflict.'],[0,2,0]],['You Interrupted','A project partner says you kept talking over them.',['Tell them they are too sensitive.','Listen, apologize, and share turns.','Say sorry but change nothing.'],['This dismisses their feelings.','You take responsibility and repair the relationship.','An apology needs follow-through.'],[0,2,1]]]},{name:'🎯 Responsibility & Planning',scenes:[['Twenty Minutes','You have twenty minutes to do homework, pack for practice, and watch videos.',['Watch videos first with no time limit.','Do homework, pack, then use extra time.','Pack, set a timer for homework, then relax.'],['Your responsibilities may get squeezed out.','You prioritize important tasks.','You make a realistic plan in a different order.'],[0,2,2]],['Overwhelmed','A big assignment is due tomorrow. You have barely started.',['Avoid it.','Break it into three small steps and begin.','Ask for guidance and plan what you can finish.'],['Avoidance can make the pressure worse.','Small steps make starting easier.','Asking for help and planning are responsible choices.'],[0,2,2]],['Plans Change','Your partner is absent on the day you planned to work together.',['Do nothing.','Complete the part you can do alone.','Ask the teacher what to prioritize.'],['You lose an opportunity to make progress.','You adapt to what you can control.','You seek clarity and keep moving.'],[0,2,2]]]},{name:'📱 Digital Choices',scenes:[['The Screenshot','Someone sends an embarrassing screenshot of another student and asks you to share it.',['Forward it.','Do not share it and ask them to stop.','Do not share it and tell an adult if someone is being targeted.'],['Sharing can spread harm.','You protect privacy and set a boundary.','You help protect someone who may be bullied.'],[0,2,2]],['Unknown Account','An unknown account promises a prize if you send your address and photo.',['Send the information.','Block or report the account and tell a trusted adult.','Ask the account if it is real.'],['Sharing private information with strangers is unsafe.','You protect your information.','The sender may not be truthful. Use trusted sources instead.'],[0,2,1]],['Late Night','It is late. You are tired, but you want to keep scrolling.',['Keep scrolling until you fall asleep.','Put the phone away and get ready for bed.','Set a short limit and then put it away.'],['You may lose sleep and focus tomorrow.','You make a choice that supports rest.','A clear boundary can help if you follow it.'],[0,2,2]]]}];
let category=-1,step=0,points=0,answers=[],selected=-1;const root=document.getElementById('game');function home(){category=-1;root.innerHTML='<section class="card"><h2>Choose a mission</h2><p>Explore everyday situations, make decisions, and discover what your choices might lead to. Play independently or discuss each decision as a class.</p>'+sets.map((s,i)=>`<button class="option" onclick="start(${i})">${s.name} →</button>`).join('')+'<p class="muted">No timer. No wrong turns that cannot become learning opportunities.</p></section>'}function start(i){category=i;step=0;points=0;answers=[];play()}function play(){let s=sets[category].scenes[step];root.innerHTML=`<section class="card"><span class="badge">${sets[category].name}</span><p>Situation ${step+1} of 3</p><div class="progress"><div style="width:${step/3*100}%"></div></div><h2>${s[0]}</h2><p style="font-size:1.2em;line-height:1.6">${s[1]}</p><h3>What would you do?</h3>${s[2].map((o,i)=>`<button class="option" onclick="choose(${i})">${'ABC'[i]}. ${o}</button>`).join('')}<button class="secondary" onclick="home()">← All missions</button></section>`}function choose(i){selected=i;let s=sets[category].scenes[step];root.innerHTML=`<section class="card"><span class="badge">Pause & Reflect</span><h2>${s[0]}</h2><p><b>You chose:</b> ${s[2][i]}</p><div class="feedback"><b>What might happen?</b><p>${s[3][i]}</p><b>Remember:</b> You can learn from every decision and choose differently next time.</div><p><button onclick="next()">${step===2?'Finish mission →':'Next situation →'}</button><button class="secondary" onclick="play()">Explore another choice</button></p></section>`}function next(){let s=sets[category].scenes[step];points+=s[4][selected];answers.push({title:s[0],choice:s[2][selected],insight:s[3][selected]});step++;if(step<3){play();return}root.innerHTML=`<section class="card"><h2>🎉 Mission complete!</h2><p>You explored three situations and practiced making thoughtful choices.</p><p><b>Growth points: ${points} / 6</b> — these are for reflection, not a grade.</p>${answers.map((a,i)=>`<p><b>${i+1}. ${a.title}</b><br>${a.choice}<br><span class="muted">${a.insight}</span></p>`).join('')}<h3>My next step</h3><p>What is one strategy you want to practice in real life?</p><textarea placeholder="Next time, I can..."></textarea><p><button onclick="home()">Choose another mission</button><button class="secondary" onclick="window.print()">Print reflection</button></p></section>`}home();
</script></html>
